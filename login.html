<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Akademik</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">Portal Akademik</h2>
    <p class="text-sm text-slate-500 text-center mb-6">Silakan masuk ke akun Anda</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Role / Peran</label>
        <select id="roleSelect" class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="mahasiswa">Mahasiswa</option>
          <option value="dosen">Dosen</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Username / NIM / NIDN</label>
        <input type="text" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Masukkan ID/Username">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Masuk
      </button>
    </form>

    <!-- Opsi Registrasi Terpisah -->
    <div class="mt-6 pt-4 border-t text-center space-y-2">
      <p class="text-xs text-slate-500">Belum memiliki akun?</p>
      <div class="flex justify-center space-x-4 text-sm">
        <a href="register-mahasiswa.html" class="text-indigo-600 font-medium hover:underline">Daftar Mahasiswa</a>
        <span class="text-slate-300">|</span>
        <a href="register-dosen.html" class="text-indigo-600 font-medium hover:underline">Daftar Dosen</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const role = document.getElementById('roleSelect').value;
      if (role === 'mahasiswa') {
        window.location.href = 'dashboard-mahasiswa.html';
      } else {
        window.location.href = 'dashboard-dosen.html';
      }
    });
  </script>
</body>
</html>
