<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Mahasiswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <!-- Navbar -->
  <nav class="bg-white border-b px-6 py-4 flex justify-between items-center">
    <h1 class="font-bold text-lg text-slate-800">Dashboard Mahasiswa</h1>
    <a href="login.html" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100">Keluar</a>
  </nav>

  <main class="max-w-4xl mx-auto p-6 space-y-6">
    <!-- Fitur 1: Absensi Hari Ini -->
    <div class="bg-white p-6 rounded-xl border shadow-sm">
      <h2 class="text-lg font-semibold mb-2">1. Absensi Kehadiran</h2>
      <p class="text-sm text-slate-500 mb-4">Mata Kuliah: Pemrograman Web (Pertemuan 4)</p>
      <button onclick="this.disabled=true; this.innerText='Sudah Absen ✓'; this.classList.replace('bg-indigo-600','bg-emerald-600')" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
        Klik Absen Hari Ini
      </button>
    </div>

    <!-- Fitur 2: Daftar Tugas -->
    <div class="bg-white p-6 rounded-xl border shadow-sm">
      <h2 class="text-lg font-semibold mb-4">2. Tugas Kuliah</h2>
      <div class="border rounded-lg p-4 space-y-3">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-medium text-slate-800">Tugas 1: Interface HTML & CSS</h3>
            <p class="text-xs text-slate-400">Tenggat: 30 Juli 2026</p>
          </div>
          <span class="text-xs px-2.5 py-1 bg-amber-100 text-amber-700 font-medium rounded-full">Belum Selesai</span>
        </div>
        <input type="file" class="block text-sm text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        <button onclick="alert('Tugas Berhasil Dikirim!')" class="bg-slate-800 text-white px-4 py-1.5 rounded text-sm hover:bg-slate-900">Kirim Tugas</button>
      </div>
    </div>
  </main>
</body>
</html>
