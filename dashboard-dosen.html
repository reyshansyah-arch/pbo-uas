<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Dosen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <nav class="bg-white border-b px-6 py-4 flex justify-between items-center">
    <h1 class="font-bold text-lg text-slate-800">Dashboard Dosen</h1>
    <a href="login.html" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100">Keluar</a>
  </nav>

  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <!-- Fitur 1: Buat Tugas Baru -->
    <div class="bg-white p-6 rounded-xl border shadow-sm">
      <h2 class="text-lg font-semibold mb-4">Buat Tugas Baru</h2>
      <form class="space-y-3" onsubmit="alert('Tugas Berhasil Dipublikasikan!'); return false;">
        <input type="text" placeholder="Judul Tugas" required class="w-full p-2 border rounded-lg">
        <textarea placeholder="Deskripsi atau Instruksi Tugas" required class="w-full p-2 border rounded-lg h-20"></textarea>
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Publikasikan Tugas</button>
      </form>
    </div>

    <!-- Fitur 2: Rekap Absensi & Edit Manual -->
    <div class="bg-white p-6 rounded-xl border shadow-sm">
      <h2 class="text-lg font-semibold mb-4">Rekap & Kelola Absensi Mahasiswa</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-sm">
              <th class="p-3">NIM</th>
              <th class="p-3">Nama Mahasiswa</th>
              <th class="p-3">Status Kehadiran</th>
              <th class="p-3">Ubah Status Manual</th>
            </tr>
          </thead>
          <tbody class="divide-y text-sm">
            <tr>
              <td class="p-3">2026001</td>
              <td class="p-3 font-medium">Budi Santoso</td>
              <td class="p-3"><span id="status-1" class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-xs">Hadir</span></td>
              <td class="p-3">
                <select onchange="document.getElementById('status-1').innerText = this.value; alert('Status Absensi Diperbarui!')" class="border p-1 rounded text-xs">
                  <option value="Hadir">Hadir</option>
                  <option value="Tidak Hadir">Tidak Hadir</option>
                  <option value="Izin">Izin</option>
                </select>
              </td>
            </tr>
            <tr>
              <td class="p-3">2026002</td>
              <td class="p-3 font-medium">Siti Rahma</td>
              <td class="p-3"><span id="status-2" class="px-2 py-1 bg-rose-100 text-rose-700 rounded text-xs">Tidak Hadir</span></td>
              <td class="p-3">
                <select onchange="document.getElementById('status-2').innerText = this.value; alert('Status Absensi Diperbarui!')" class="border p-1 rounded text-xs">
                  <option value="Tidak Hadir">Tidak Hadir</option>
                  <option value="Hadir">Hadir</option>
                  <option value="Izin">Izin</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
